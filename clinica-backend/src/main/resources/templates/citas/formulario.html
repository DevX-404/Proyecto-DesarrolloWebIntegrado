<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 py-12">
  <div class="max-w-xl w-full space-y-6 bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
    
    <div class="text-center">
      <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-xl bg-blue-600 text-white shadow-lg shadow-blue-600/30">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
      </div>
      <h2 class="mt-4 text-2xl font-black text-slate-800 tracking-tight">Gestión de Citas Médicas</h2>
      <p class="mt-1 text-xs text-slate-400 uppercase tracking-widest font-bold">MediQu Hospitalario</p>
    </div>

    <form class="space-y-4">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-400 uppercase">Seleccionar Paciente *</label>
          <select class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 outline-none focus:border-blue-500 transition-all cursor-pointer">
            <option value="">Seleccione un paciente</option>
            </select>
        </div>
        
        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-400 uppercase">Médico Especialista *</label>
          <select class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 outline-none focus:border-blue-500 transition-all cursor-pointer">
            <option value="">Seleccione un médico</option>
            </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-400 uppercase">Fecha y Hora de la Cita *</label>
          <input type="datetime-local" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold text-slate-600 outline-none focus:border-blue-500 transition-all">
        </div>

        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-400 uppercase">Estado Inicial</label>
          <select class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold text-blue-600 outline-none focus:border-blue-500 transition-all cursor-pointer">
            <option value="PENDIENTE">Pendiente</option>
            <option value="CONFIRMADA">Confirmada</option>
          </select>
        </div>
      </div>

      <div class="space-y-1">
        <label class="text-[10px] font-bold text-slate-400 uppercase">Motivo de Consulta *</label>
        <input type="text" placeholder="Ej. Control de hipertensión o chequeo general" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs outline-none focus:border-blue-500 transition-all">
      </div>

      <div class="space-y-1">
        <label class="text-[10px] font-bold text-slate-400 uppercase">Observaciones Preliminares</label>
        <textarea rows="3" placeholder="Notas o requerimientos especiales del paciente..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs outline-none focus:border-blue-500 transition-all resize-none"></textarea>
      </div>

      <div class="flex gap-3 pt-3">
        <button type="button" class="flex-1 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs transition-all">
          Cancelar
        </button>
        <button type="submit" class="flex-[2] px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-md shadow-blue-600/10 transition-all">
          Agendar Cita Médica
        </button>
      </div>

    </form>
  </div>
</div>
