<div class="flex h-screen bg-slate-50 overflow-hidden text-sm">
  
  <aside class="w-60 bg-white border-r border-slate-200 flex flex-col justify-between hidden md:flex">
    <div class="p-4">
      <div class="flex items-center gap-2 mb-6 px-2">
        <div class="p-1.5 bg-blue-600 rounded-lg text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
          </svg>
        </div>
        <span class="text-lg font-bold text-slate-800 tracking-tight">MediQu</span>
      </div>

      <nav class="space-y-0.5">
        @for (item of menuItems; track item.label) {
          <a [routerLink]="item.route" 
             routerLinkActive="bg-slate-100 text-blue-600 font-semibold"
             class="flex items-center gap-2.5 px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-lg transition-all text-xs">
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"></path>
            </svg>
            {{ item.label }}
          </a>
        }
      </nav>
    </div>

    <div class="p-4 border-t border-slate-100">
      <button (click)="logout()" class="w-full flex items-center justify-center gap-1.5 py-2 text-xs font-medium text-red-600 hover:bg-red-50 rounded-lg transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        Cerrar Sesión
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
    
    <header class="h-12 bg-white border-b border-slate-200 flex items-center justify-between px-4 z-10">
      <div class="text-xs font-medium text-slate-400 uppercase tracking-wider">Módulos Hospitalarios</div>
      
      <div class="flex items-center gap-2">
        <div class="text-right">
          <p class="text-xs font-semibold text-slate-700 leading-tight">{{ username }}</p>
          <span class="text-[10px] text-green-500 font-medium flex items-center gap-1 justify-end">
            <span class="w-1 h-1 rounded-full bg-green-500"></span> Online
          </span>
        </div>
        <div class="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center font-bold text-xs">
          {{ username.charAt(0).toUpperCase() }}
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto bg-slate-50">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
