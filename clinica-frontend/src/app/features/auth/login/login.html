<div class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 px-4 transition-colors duration-300">
  <div class="max-w-md w-full space-y-8 bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-800">
    
    <div class="text-center">
      <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-xl bg-blue-600 text-white shadow-lg shadow-blue-600/30">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
        </svg>
      </div>
      <h2 class="mt-4 text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
        MediQu Portal
      </h2>
      <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
        Ingresa tus credenciales para acceder al sistema clínico
      </p>
    </div>

    @if (errorMessage) {
      <div class="p-4 mb-4 text-sm text-red-800 rounded-xl bg-red-50 dark:bg-gray-800 dark:text-red-400 border border-red-100 dark:border-red-900/30" role="alert">
        <span class="font-bold">Error:</span> {{ errorMessage }}
      </div>
    }

    <form class="mt-8 space-y-6" (ngSubmit)="onLogin()">
      <div class="space-y-4">
        
        <div>
          <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">
            Nombre de Usuario
          </label>
          <input 
            type="text" 
            name="username"
            [(ngModel)]="username"
            required
            class="appearance-none rounded-xl relative block w-full px-3 py-3 border border-slate-200 dark:border-slate-700 placeholder-slate-400 dark:placeholder-slate-500 text-slate-900 dark:text-white bg-slate-50 dark:bg-slate-800/50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all sm:text-sm" 
            placeholder="ej. admin o medico">
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">
            Contraseña
          </label>
          <input 
            type="password" 
            name="password"
            [(ngModel)]="password"
            required
            class="appearance-none rounded-xl relative block w-full px-3 py-3 border border-slate-200 dark:border-slate-700 placeholder-slate-400 dark:placeholder-slate-500 text-slate-900 dark:text-white bg-slate-50 dark:bg-slate-800/50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all sm:text-sm" 
            placeholder="••••••••">
        </div>

      </div>

      <div>
        <button 
          type="submit" 
          class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all shadow-lg shadow-blue-600/20">
          Iniciar Sesión
        </button>
      </div>

    </form>
  </div>
</div>
